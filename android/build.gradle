plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // WP4: Room compiler via KSP.
    id 'com.google.devtools.ksp'
}

android {
    namespace 'qhybrid.android'
    compileSdk 34

    defaultConfig {
        applicationId 'qhybrid.android'
        minSdk 26          // Android 8.0 — BLE companion mode, notification access (ANDROID-PLAN §5)
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // WP4: Robolectric unit tests need Android resources available on the JVM.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// WP4: Room schema export location (kept off for now; schemas aren't checked in).
ksp {
    arg('room.incremental', 'true')
}

dependencies {
    // Shared protocol library (pure platform-neutral Java). After the protocol
    // re-own there are no Android-API stubs in :protocol, so the REAL Android SDK
    // classes resolve naturally — a plain project dependency is all we need.
    implementation project(':protocol')
    // Route the protocol's slf4j logs to Android logcat (otherwise they no-op
    // and we are blind to FossilQAdapter's auth/init behavior).
    implementation 'uk.uuid.slf4j:slf4j-android:2.0.9-0'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.13.1'
    // WP3: StateFlow connection-state holder + lifecycle-aware collection in Compose.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    // WP4: Room persistence (multi-watch + clone/transfer). Pure data layer, no BLE.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WP4: headless DAO/transfer tests on the JVM (in-memory Room via Robolectric).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}

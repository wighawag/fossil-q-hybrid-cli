plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'qhybrid.android'
    compileSdk 34

    defaultConfig {
        applicationId 'qhybrid.android'
        minSdk 26          // Android 8.0 — BLE companion mode, notification access (ANDROID-PLAN §5)
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // Shared protocol library, SHIM-STRIPPED for Android (ROADMAP Phase 2 Option 2).
    // We consume :protocol's 'androidApi' configuration, which excludes the
    // android/* and androidx/* API stubs so the REAL Android SDK classes resolve
    // (BluetoothGattCharacteristic, Build, Context, ...). The nodomain/* GB stubs
    // and qhybrid.linux.* protocol code are still included.
    implementation project(path: ':protocol', configuration: 'androidApi')
    // :protocol exposes slf4j-api as `api`, but a raw-artifact dependency does
    // not carry transitive deps, so declare it explicitly here.
    implementation 'org.slf4j:slf4j-api:2.0.9'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.13.1'
}

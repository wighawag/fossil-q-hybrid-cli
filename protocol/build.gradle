plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // The protocol layer is pure, platform-neutral Java. Its ONLY dependency is
    // slf4j-api (exposed to consumers :cli / :android, hence `api`). No Android,
    // no Linux, no vendored GadgetBridge tree, no shims.
    api 'org.slf4j:slf4j-api:2.0.9'

    // --- Test harness (JVM-only): FakeBleTransport + golden-byte regression gates ---
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
    // activity*.bin fixtures live at the repo root; expose the path to tests.
    systemProperty 'fossilq.repoRoot', rootDir.absolutePath
}

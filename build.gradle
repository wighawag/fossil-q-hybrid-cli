// Root build script for the fossil-qhybrid multi-module project.
//
// Modules:
//   :protocol  pure-Java library — vendored Gadgetbridge protocol tree + shared adapters
//   :cli       Linux CLI application (shadowJar) — depends on :protocol
//   :android   Android (Compose) skeleton app — depends on :protocol
//
// Plugin versions are declared here (apply false) so the subprojects can apply
// them without repeating versions. The root project itself applies nothing.

plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
}

allprojects {
    group = 'qhybrid'
    version = '0.1.0'
}

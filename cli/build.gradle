plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'qhybrid.linux.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    // Shared protocol library (vendored GB tree + FossilQAdapter + BleTransport + config)
    implementation project(':protocol')

    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    implementation 'com.google.code.gson:gson:2.10.1'

    // dbus-java + bluez-dbus: direct D-Bus access to BlueZ (no subprocess needed)
    implementation 'com.github.hypfvieh:bluez-dbus:0.3.2'
    implementation 'com.github.hypfvieh:dbus-java-transport-native-unixsocket:5.1.1'

    // JLine 3: raw terminal input for interactive calibration TUI
    implementation 'org.jline:jline:3.26.3'
}

// Fat JAR — preserves the historical `fossil-q` artifact name/coordinates.
shadowJar {
    archiveBaseName.set('fossil-q')
    archiveClassifier.set('')
    archiveVersion.set('')
}
